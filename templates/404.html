{% extends "base_landing.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: var(--spacing-3xl) var(--spacing-xl);">
    <h1 style="font-size: var(--font-size-4xl); color: var(--danger-color); margin-bottom: var(--spacing-md);">404</h1>
    <p style="font-size: var(--font-size-lg); color: var(--text-secondary); margin-bottom: var(--spacing-xl);">Page not found</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
