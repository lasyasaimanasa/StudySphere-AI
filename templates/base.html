<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudySphere AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-logo">StudySphere AI</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="{{ url_for('materials') }}" class="nav-item">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">Materials</span>
                </a>
                <a href="{{ url_for('tutor') }}" class="nav-item">
                    <span class="nav-icon">🤖</span>
                    <span class="nav-text">AI Tutor</span>
                </a>
                <a href="{{ url_for('progress') }}" class="nav-item">
                    <span class="nav-icon">📈</span>
                    <span class="nav-text">Progress</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">👤</div>
                    <div class="user-info">
                        <span class="user-name">Student</span>
                        <span class="user-email">student@example.com</span>
                    </div>
                </div>
                <button class="logout-btn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/youtube_url.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
