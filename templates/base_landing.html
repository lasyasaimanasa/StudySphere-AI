<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudySphere AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="landing-page">
    <nav class="landing-nav">
        <div class="nav-container">
            <div class="nav-logo">StudySphere AI</div>
            <div class="nav-links">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Dashboard</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="landing-footer">
        <p>&copy; 2026 StudySphere AI - Multimodal AI Hackathon 2026, Track D</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
